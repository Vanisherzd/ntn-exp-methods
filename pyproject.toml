[project]
name = "orbit-evidence"
version = "1.0.0"
description = "A deployment-causality and falsifiability contract for learning-assisted satellite communication software, with a curated fault-injection regression suite"
readme = "README.md"
requires-python = ">=3.10"

# numpy is the ONLY runtime dependency of the toolkit. The paper makes that claim, so it
# is enforced here rather than merely described: nothing else belongs in this list.
# The paper build additionally needs a TeX Live installation providing latexmk and
# IEEEtran, which is not a Python dependency.
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
# Running the gate (tests, matrix, claim checks) needs pytest and nothing more.
test = ["pytest>=7.4.0"]
dev = ["pytest>=7.4.0", "ruff>=0.1.0"]

# The STOPPED research lines under archive/ were built against a much larger stack.
# None of it is required to reproduce anything this paper claims. Install only if you
# intend to re-run archived code, which is not recommended --
# see archive/KNOWN_INVALID_RESULTS.md.
archived-research = [
    "torch>=2.1.0",
    "scipy>=1.11.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "hydra-core>=1.3.0",
    "pyserial>=3.5",
    "sgp4>=2.23",
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_evidence"]

[tool.pytest.ini_options]
# The toolkit lives under src/, the fixtures are imported by the fault-injection tests,
# and the contract rules by both. `make test` is the supported entry point.
pythonpath = ["src", "tests/fixtures", "evaluation/scripts"]
testpaths = ["tests/regression", "tests/fault_injection"]

[tool.ruff]
line-length = 88
lint.select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# Toolkit imports follow a sys.path insertion in the test and evaluation entry points.
"tests/**" = ["E402"]
"evaluation/**" = ["E402"]
