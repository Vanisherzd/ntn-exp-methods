  # --- R0/R1/R2/R3 execution record ---
  post_preregistration_bugfix:
    what: pass_intervals() exit-crossing bisection received its bracket reversed
      (t_below/t_above swapped), so the loop guard `b - a <= tol` was immediately
      true and the exit time was never refined -- it returned the coarse 60 s
      midpoint, placing the 0.90-offset sample up to 30 s past the true threshold
      exit and thus marginally BELOW the 10 deg mask (observed min 9.472 deg)
    found_by: pre-registered test V3 in tests/test_visible_causal_integrity.py
    fixed_how: refine() made order-agnostic and now returns the above-threshold
      side of the final bracket
    is_this_a_parameter_change: NO -- no threshold, offset, horizon, cadence or
      model setting was altered; a bisection bracket was corrected so the code
      does what the pre-registration already specified
    consequence: all registries and labels regenerated; registry hashes changed;
      the R3 verdict was FAIL both before and after (max SMD 1.312 -> 1.307
      NOMINAL, 1.557 -> 1.552 DEGRADED), so the conclusion does not rest on it
    verified_after: global minimum predicted elevation 10.034 deg (thr10) and
      20.053 deg (thr20); 9 of 11 integrity tests pass, 2 skipped (V10 needs the
      walk-forward module, which the R3 gate stops us from building)
  stages: {R0: COMPLETE, R1: COMPLETE, R2: COMPLETE, R3: FAIL, R4: COMPLETE,
           R5: COMPLETE, R6: PASS, R7: COMPLETE, R8: COMPLETE,
           R9: NOT_RUN (blocked by R3), R10: NOT_RUN (blocked by R3),
           R11: NOT_RUN (blocked by R3), S2: UNRESOLVED}
  R3_failure: label censoring is missing-not-at-random on TLE age. max |SMD|
    labelled vs censored = 1.307 NOMINAL / 1.552 DEGRADED against a 0.10 gate,
    driven by age_tx_s (up to 1.35) and calendar time (up to 1.55); geometry
    variables are balanced (<= 0.28). Mechanism: a catalogue publication outage
    simultaneously makes the held element stale AND removes the later solutions
    needed to label it -- censored rows have 4-13x larger time-to-next-publication
    (ISS 2.88 -> 44.63 h; BLACK KITE-1 4.94 -> 63.90 h).
  restriction_does_not_rescue: no age cap makes censoring non-differential for all
    satellites (BLACK KITE-1 SMD 0.755 at age<=30h, 0.536 at <=36h)
  what_the_rebuild_DID_fix: [100 pct of transmissions above the 10 deg mask,
    row membership independent of the future catalogue (test V1 passes),
    label identifiability (uncertainty ratio p50 1.81 -> 0.06-0.39),
    R6 coverage PASS with 9 satellites / 6 regimes / 110699 COMPLETE transmissions]
